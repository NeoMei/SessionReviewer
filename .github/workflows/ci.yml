name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-15-intel-x64
            os: macos-15-intel
          - name: macos-15-apple-silicon-arm64
            os: macos-15
          - name: windows-x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - name: Stress native Windows replacement
        if: runner.os == 'Windows'
        run: go test ./internal/atomicfile -run '^TestWindows' -count=20
      - run: go test -race ./... -skip '^TestFoundationLargeSessionReachesBoundedPacketAfterStreamingPast20MiB$'
      - run: go test ./internal/prepare -run '^TestFoundationPrepareFromStartIsByteStableAndCursorSideEffectFree$' -count=2
      - run: go vet ./...
      - run: go build ./cmd/session-reviewer
