name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-15-intel-x64
            os: macos-15-intel
          - name: macos-15-apple-silicon-arm64
            os: macos-15
          - name: windows-x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - name: Repeat review v2 migration and CLI contract tests
        run: go test ./internal/reviewv2 ./internal/sync ./internal/cli ./internal/config ./internal/project -run 'Migration|MachineLedger|ProjectID|ProjectFragment|FragmentCommit|SharedConfig|ReviewV2' -count=2
      - name: Stress native Windows replacement
        if: runner.os == 'Windows'
        run: go test ./internal/atomicfile -run '^TestWindows' -count=20
      - run: go test -race ./... -skip '^TestFoundationLargeSessionReachesBoundedPacketAfterStreamingPast20MiB$'
      - run: go test ./internal/prepare -run '^TestFoundationPrepareFromStartIsByteStableAndCursorSideEffectFree$' -count=2
      - run: go vet ./...
      - name: Reproducible shell release wrappers and schema
        if: runner.os == 'macOS'
        run: |
          ./scripts/build-release.sh 0.2.0 "$RUNNER_TEMP/release-one"
          ./scripts/build-release.sh 0.2.0 "$RUNNER_TEMP/release-two"
          for artifact in SHA256SUMS session-reviewer_0.2.0_darwin_amd64.tar.gz session-reviewer_0.2.0_darwin_arm64.tar.gz session-reviewer_0.2.0_windows_amd64.zip; do
            cmp "$RUNNER_TEMP/release-one/$artifact" "$RUNNER_TEMP/release-two/$artifact"
          done
          (cd "$RUNNER_TEMP/release-one" && shasum -a 256 -c SHA256SUMS)
          mkdir "$RUNNER_TEMP/release-unpack"
          tar -xzf "$RUNNER_TEMP/release-one/session-reviewer_0.2.0_darwin_arm64.tar.gz" -C "$RUNNER_TEMP/release-unpack"
          cmp schemas/review-ledger-v2.schema.json "$RUNNER_TEMP/release-unpack/session-reviewer/schemas/review-ledger-v2.schema.json"
      - name: Reproducible PowerShell release wrappers and schema
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $one = Join-Path $env:RUNNER_TEMP "release-one"
          $two = Join-Path $env:RUNNER_TEMP "release-two"
          .\scripts\build-release.ps1 -Version 0.2.0 -Dist $one
          .\scripts\build-release.ps1 -Version 0.2.0 -Dist $two
          $artifacts = @("SHA256SUMS", "session-reviewer_0.2.0_darwin_amd64.tar.gz", "session-reviewer_0.2.0_darwin_arm64.tar.gz", "session-reviewer_0.2.0_windows_amd64.zip")
          foreach ($artifact in $artifacts) {
            $first = (Get-FileHash -Algorithm SHA256 (Join-Path $one $artifact)).Hash
            $second = (Get-FileHash -Algorithm SHA256 (Join-Path $two $artifact)).Hash
            if ($first -ne $second) { throw "non-reproducible artifact: $artifact" }
          }
          Get-Content (Join-Path $one "SHA256SUMS") | ForEach-Object {
            if ($_ -notmatch '^([0-9a-f]{64})  (.+)$') { throw "invalid SHA256SUMS line: $_" }
            $actual = (Get-FileHash -Algorithm SHA256 (Join-Path $one $Matches[2])).Hash.ToLowerInvariant()
            if ($actual -ne $Matches[1]) { throw "checksum mismatch: $($Matches[2])" }
          }
          $unpack = Join-Path $env:RUNNER_TEMP "release-unpack"
          Expand-Archive -LiteralPath (Join-Path $one "session-reviewer_0.2.0_windows_amd64.zip") -DestinationPath $unpack
          $sourceSchema = (Get-FileHash -Algorithm SHA256 "schemas/review-ledger-v2.schema.json").Hash
          $packedSchema = (Get-FileHash -Algorithm SHA256 (Join-Path $unpack "session-reviewer\schemas\review-ledger-v2.schema.json")).Hash
          if ($sourceSchema -ne $packedSchema) { throw "packaged review v2 schema differs from source" }
      - run: go build -o "${{ runner.temp }}/session-reviewer" ./cmd/session-reviewer
      - name: Cross-build Windows x64 gate
        if: runner.os != 'Windows'
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: |
          go test -c -o reviewv2.test.exe ./internal/reviewv2
          go test -c -o sync.test.exe ./internal/sync
          go test -c -o cli.test.exe ./internal/cli
          go test -c -o project.test.exe ./internal/project
      - name: Cross-build macOS Intel gate
        if: runner.os == 'Windows'
        env:
          CGO_ENABLED: "0"
          GOOS: darwin
          GOARCH: amd64
        run: |
          go test -c -o reviewv2.test ./internal/reviewv2
          go test -c -o sync.test ./internal/sync
          go test -c -o cli.test ./internal/cli
          go test -c -o project.test ./internal/project
